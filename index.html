<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0AQMAAAAHA5RxAAAABlBMVEUPERVK3oDheHEiAAAAr0lEQVR42u2VQQrCMBBFX9JCXQj2CD2CN2hvZr1ZvIFH6BG600WacaGhyaIiRYrgvFX+I4HJwCSgKIqirKSSMcsSAAs79qk2mB4s1NjUW+jAQoNJfQkN+db81Bd962MuxCW+K+ZqjnHZioj0r3AQERm2qvP3fexPhvZH/YI/myf1X8/LSebH9PbBvLgpZs81vpbApYx+MtV9o3sNSGo8vK9/JKQmgFv+RxRFUZR1PAD0gD+e6gvzwgAAAABJRU5ErkJggg==">
<title>Lift Log</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e8eaf0;--mute:#8b93a4;--acc:#4ade80;--acc2:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc2);border-color:var(--acc2);color:#04130a;font-weight:700}
button.danger{color:var(--bad)}
button.ghost{background:transparent}
button.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:transparent}
.set{display:flex;align-items:center;gap:6px;margin:6px 0}
.set .n{width:20px;color:var(--mute);font-size:13px;text-align:center}
.set input{width:72px;text-align:center;padding:9px 4px}
.set .u{color:var(--mute);font-size:13px;width:28px}
.chk{width:44px;height:40px;padding:0;margin-left:auto;font-size:18px;color:var(--mute)}
.chk.on{background:var(--acc2);border-color:var(--acc2);color:#04130a}
.cue{font-size:12.5px;color:var(--warn);margin:2px 0 6px}
.badge{display:inline-block;background:var(--acc2);color:#04130a;font-weight:800;border-radius:8px;padding:2px 9px;margin-right:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 0;font-size:12px;color:var(--mute)}
nav button.on{color:var(--acc)}
nav button span{display:block;font-size:20px}
#rest{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--acc2);color:#04130a;border-radius:12px;padding:12px 16px;font-weight:700;display:none;z-index:6;justify-content:space-between}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}
.seg button.on{background:var(--acc2);color:#04130a;border-color:var(--acc2);font-weight:700}
svg text{fill:var(--mute);font-size:10px}
.hist-ex{font-size:13px;color:var(--mute);margin-top:4px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mute)}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest"><span id="restTxt"></span><span>tap to skip</span></div>
<nav id="nav"></nav>

<script>
"use strict";
/* ---------- helpers ---------- */
const KEY = "liftlog.v1";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmtDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); };

/* ---------- program (Lower / Upper / Full rotation) ---------- */
// kind: wt = kg x reps, bw = reps only (bodyweight / band), time = minutes
const PROGRAM = {
  Lower: [   // Monday
    { name: "Hack Squat", kind: "wt", sets: 4, w: 30, r: 9, cue: "" },
    { name: "Leg Curl", kind: "wt", sets: 4, w: 37.5, r: 10, ss: "Calf Raise", cue: "" },
    { name: "Seated Calf Raise", kind: "wt", sets: 4, w: 20, r: 10, ss: "Leg Curl", cue: "" },
    { name: "Leg Press", kind: "wt", sets: 3, w: 70, r: 10, cue: "" },
    { name: "Barbell RDL (plates, excl. bar)", kind: "wt", sets: 2, w: 20, r: 10, cue: "Neutral spine and neck. Stop where your hamstrings stop." }
  ],
  Upper: [   // Tuesday
    { name: "Wide Lat Pulldown", kind: "wt", sets: 4, w: 37.5, r: 11, ss: "DB Incline Press", cue: "Depress your scapulae before you pull, no lumbar rounding." },
    { name: "DB Incline Press (per hand)", kind: "wt", sets: 4, w: 17.5, r: 10, ss: "Wide Lat Pulldown", cue: "" },
    { name: "DB Shoulder Press (per hand)", kind: "wt", sets: 3, w: 15, r: 8, cue: "" },
    { name: "Single-Arm Joe Wilder Row", kind: "wt", sets: 3, w: 20, r: 10, cue: "" },
    { name: "Flys", kind: "wt", sets: 3, w: 35, r: 11, cue: "" },
    { name: "Lateral Raise (per hand)", kind: "wt", sets: 3, w: 7.5, r: 10, cue: "" },
    { name: "Bicep Curl Machine", kind: "wt", sets: 2, w: 20, r: 10, cue: "" }
  ],
  Full: [    // Thursday
    { name: "Leg Extension", kind: "wt", ws: [40, 40, 47, 47], r: 11, cue: "" },
    { name: "Leg Curl", kind: "wt", sets: 4, w: 37.5, r: 11, cue: "" },
    { name: "Horizontal Row", kind: "wt", sets: 4, w: 42.5, r: 10, cue: "" },
    { name: "Chest Press Machine", kind: "wt", sets: 3, w: 33, r: 11, cue: "" },
    { name: "Lateral Raise (per hand)", kind: "wt", sets: 3, w: 7.5, r: 10, cue: "" },
    { name: "Bicep Curl Machine", kind: "wt", sets: 2, w: 20, r: 10, cue: "" }
  ]
};
const ORDER = ["Lower", "Upper", "Full"];
const DAYHINT = { Lower: "Mon", Upper: "Tue", Full: "Thu" };

/* ---------- state ---------- */
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || typeof S !== "object") S = {};
S.sessions = S.sessions || []; S.bw = S.bw || []; S.draft = S.draft || null; S.restSec = S.restSec || 90;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert("Couldn't save: storage is full or blocked."); } };

let tab = "today", progEx = "", progMetric = "top", rest = null;

/* ---------- logic ---------- */
function nextType() {
  const last = S.sessions[S.sessions.length - 1];
  if (!last || !ORDER.includes(last.type)) return "Lower";
  return ORDER[(ORDER.indexOf(last.type) + 1) % 3];
}
function lastFor(name) {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const ex = S.sessions[i].exercises.find(e => e.name === name);
    if (ex) { const d = ex.sets.filter(s => s.done); if (d.length) return d[d.length - 1]; }
  }
  return null;
}
function startSession(type) {
  S.draft = {
    id: uid(), date: todayStr(), type, note: "",
    exercises: PROGRAM[type].map(t => {
      const l = lastFor(t.name);
      const n = t.ws ? t.ws.length : t.sets;
      return { name: t.name, kind: t.kind, cue: t.cue, ss: t.ss || "",
        sets: Array.from({ length: n }, (_, i) => ({ w: l ? l.w : (t.ws ? t.ws[i] : t.w), r: l ? l.r : t.r, done: false })) };
    })
  };
  save(); render();
}
function exStats(ex) {
  const d = ex.sets.filter(s => s.done);
  if (!d.length) return null;
  if (ex.kind === "wt") return { top: Math.max(...d.map(s => num(s.w))), vol: d.reduce((a, s) => a + num(s.w) * num(s.r), 0) };
  const r = d.map(s => num(s.r));
  return { top: Math.max(...r), vol: r.reduce((a, b) => a + b, 0) };
}
function summary(ex) {
  const d = ex.sets.filter(s => s.done);
  if (!d.length) return "";
  if (ex.kind === "wt") return ex.name + " " + d.map(s => num(s.w) + "×" + num(s.r)).join(", ");
  if (ex.kind === "time") return ex.name + " " + d.reduce((a, s) => a + num(s.r), 0) + " min";
  return ex.name + " " + d.map(s => num(s.r)).join(", ");
}
function knownNames() {
  const set = new Set();
  Object.values(PROGRAM).forEach(a => a.forEach(e => set.add(e.name)));
  S.sessions.forEach(x => x.exercises.forEach(e => set.add(e.name)));
  ["Tricep Extension Machine", "Leg Extension", "Close Grip Pulldown", "Incline Bench Machine", "Chest Press Machine"].forEach(n => set.add(n));
  return [...set].sort();
}
function startRest() {
  rest = { end: Date.now() + S.restSec * 1000 };
  tickRest();
}
function tickRest() {
  const el = document.getElementById("rest");
  if (!rest) { el.style.display = "none"; return; }
  const left = Math.ceil((rest.end - Date.now()) / 1000);
  if (left <= 0) { rest = null; el.style.display = "none"; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); return; }
  el.style.display = "flex";
  document.getElementById("restTxt").textContent = "Rest " + Math.floor(left / 60) + ":" + pad(left % 60);
}
setInterval(tickRest, 250);
document.getElementById("rest").onclick = () => { rest = null; tickRest(); };

/* ---------- charts ---------- */
function lineChart(pts, unit) {
  if (pts.length < 2) return '<p class="mute">Need at least 2 data points for a chart.</p>';
  const W = 320, H = 150, p = 26;
  const ys = pts.map(q => q.y), min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const X = i => p + i * (W - 2 * p) / (pts.length - 1);
  const Y = v => H - p - (v - min) / span * (H - 2 * p);
  const path = pts.map((q, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(q.y).toFixed(1)).join(" ");
  const dots = pts.map((q, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="3" fill="#4ade80"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="chart">
    <line x1="${p}" y1="${H - p}" x2="${W - p}" y2="${H - p}" stroke="#2a2f3a"/>
    <path d="${path}" fill="none" stroke="#4ade80" stroke-width="2"/>${dots}
    <text x="2" y="${Y(max) + 3}">${+max.toFixed(1)}</text><text x="2" y="${Y(min) + 3}">${+min.toFixed(1)}</text>
    <text x="${p}" y="${H - 8}">${esc(pts[0].x)}</text><text x="${W - p}" y="${H - 8}" text-anchor="end">${esc(pts[pts.length - 1].x)}</text>
  </svg><div class="mute" style="text-align:right">${unit}</div>`;
}

/* ---------- views ---------- */
function viewToday() {
  const d = S.draft;
  if (!d) {
    const n = nextType();
    return `<h1>Lift Log</h1>
    <div class="card"><div class="mute">Next up</div>
      <h2 style="font-size:28px;margin:4px 0 8px"><span class="badge">${n}</span>${PROGRAM[n].map(e => esc(e.name.replace(/ \(.*\)/, ""))).slice(0, 3).join(", ")}…</h2>
      <button class="pri" style="width:100%" data-act="start" data-t="${n}">Start ${n} (${DAYHINT[n]})</button></div>
    <div class="mute" style="margin:6px 2px">Or pick a different one:</div>
    <div class="seg">${ORDER.map(t => `<button data-act="start" data-t="${t}">${t} <span class="mute">${DAYHINT[t]}</span></button>`).join("")}</div>
    ${S.sessions.length ? `<div class="mute">Last: ${S.sessions[S.sessions.length - 1].type} on ${fmtDate(S.sessions[S.sessions.length - 1].date)}</div>` : ""}`;
  }
  const done = d.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
  const tot = d.exercises.reduce((a, e) => a + e.sets.length, 0);
  return `<div class="row"><h1 class="sp"><span class="badge">${d.type}</span>${fmtDate(d.date)}</h1><span class="pill">${done}/${tot} sets</span></div>
  ${d.exercises.map((ex, ei) => `<div class="card">
    <div class="row"><h2 class="sp">${esc(ex.name)}</h2><button class="sm ghost danger" data-act="rmex" data-e="${ei}">✕</button></div>
    ${ex.ss ? `<div class="mute" style="margin-bottom:4px">Superset with ${esc(ex.ss)}</div>` : ""}${ex.cue ? `<div class="cue">⚠ ${esc(ex.cue)}</div>` : ""}
    ${ex.sets.map((s, si) => `<div class="set"><span class="n">${si + 1}</span>
      ${ex.kind === "wt" ? `<input inputmode="decimal" data-f="w" data-e="${ei}" data-s="${si}" value="${s.w}"><span class="u">kg</span>` : ""}
      <input inputmode="decimal" data-f="r" data-e="${ei}" data-s="${si}" value="${s.r}"><span class="u">${ex.kind === "time" ? "min" : "reps"}</span>
      <button class="chk ${s.done ? "on" : ""}" data-act="tog" data-e="${ei}" data-s="${si}" aria-label="done">✓</button></div>`).join("")}
    <div class="row" style="margin-top:8px"><button class="sm" data-act="addset" data-e="${ei}">+ Set</button>
      ${ex.sets.length > 1 ? `<button class="sm ghost" data-act="rmset" data-e="${ei}">− Set</button>` : ""}</div>
  </div>`).join("")}
  <div class="card"><h2>Add exercise</h2><div class="row">
    <input id="newName" list="exlist" placeholder="Name (e.g. Tricep Extension)"><datalist id="exlist">${knownNames().map(n => `<option value="${esc(n)}">`).join("")}</datalist><select id="newKind" style="width:110px"><option value="wt">kg × reps</option><option value="bw">reps</option><option value="time">minutes</option></select>
    <button data-act="addex">Add</button></div></div>
  <div class="card"><h2>Notes</h2><textarea id="note" rows="2" placeholder="How did it feel? Form notes…">${esc(d.note || "")}</textarea></div>
  <button class="pri" style="width:100%;margin-bottom:10px" data-act="finish">Finish &amp; Save</button>
  <button class="ghost danger" style="width:100%" data-act="discard">Discard session</button>`;
}
function viewHistory() {
  if (!S.sessions.length) return `<h1>History</h1><p class="mute">No sessions logged yet.</p>`;
  return `<h1>History</h1>` + S.sessions.slice().reverse().map(s => `<div class="card">
    <div class="row"><span class="badge">${s.type}</span><b class="sp">${fmtDate(s.date)}</b><button class="sm ghost danger" data-act="delsess" data-id="${s.id}">Delete</button></div>
    ${s.exercises.map(summary).filter(Boolean).map(t => `<div class="hist-ex">${esc(t)}</div>`).join("")}
    ${s.note ? `<div class="hist-ex" style="color:var(--tx);margin-top:8px">“${esc(s.note)}”</div>` : ""}</div>`).join("");
}
function viewProgress() {
  const names = [...new Set(S.sessions.flatMap(s => s.exercises.filter(e => e.sets.some(x => x.done)).map(e => e.name)))];
  if (!progEx || !names.includes(progEx)) progEx = names[0] || "";
  let lifts = "";
  if (!names.length) lifts = `<p class="mute">Log a session to see lift progress.</p>`;
  else {
    const pts = [];
    S.sessions.forEach(s => { const ex = s.exercises.find(e => e.name === progEx); const st = ex && exStats(ex); if (st) pts.push({ x: s.date.slice(5), y: st[progMetric], kind: ex.kind }); });
    const kind = pts.length ? pts[0].kind : "wt";
    const unit = progMetric === "top" ? (kind === "wt" ? "kg (top set)" : kind === "time" ? "min" : "reps (best set)") : (kind === "wt" ? "kg × reps (volume)" : "total " + (kind === "time" ? "min" : "reps"));
    const pr = pts.length ? Math.max(...pts.map(p => p.y)) : 0;
    lifts = `<select id="progEx">${names.map(n => `<option ${n === progEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <div class="seg" style="margin-top:8px"><button class="${progMetric === "top" ? "on" : ""}" data-act="metric" data-m="top">Top set</button><button class="${progMetric === "vol" ? "on" : ""}" data-act="metric" data-m="vol">Volume</button></div>
      ${lineChart(pts, unit)}<div class="mute">Best: <b style="color:var(--acc)">${+pr.toFixed(1)}</b> · ${pts.length} sessions</div>`;
  }
  const bw = S.bw.slice().sort((a, b) => a.date.localeCompare(b.date));
  let avg = "";
  if (bw.length) {
    const last = bw[bw.length - 1], cut = new Date(last.date); cut.setDate(cut.getDate() - 6);
    const cs = cut.getFullYear() + "-" + pad(cut.getMonth() + 1) + "-" + pad(cut.getDate());
    const w = bw.filter(b => b.date >= cs);
    avg = `<div class="mute">7-day avg: <b style="color:var(--acc)">${(w.reduce((a, b) => a + b.kg, 0) / w.length).toFixed(1)} kg</b> (${w.length} entries) · latest ${last.kg} kg</div>`;
  }
  return `<h1>Progress</h1>
  <div class="card"><h2>Lifts</h2>${lifts}</div>
  <div class="card"><h2>Bodyweight</h2>
    <div class="row"><input id="bwDate" type="date" value="${todayStr()}" style="width:150px"><input id="bwKg" inputmode="decimal" placeholder="kg"><button class="pri" data-act="addbw">Add</button></div>
    <div style="margin-top:8px">${lineChart(bw.slice(-30).map(b => ({ x: b.date.slice(5), y: b.kg })), "kg")}</div>${avg}
    ${bw.slice(-5).reverse().map(b => `<div class="row" style="margin-top:6px"><span class="sp mute">${fmtDate(b.date)}</span><b>${b.kg} kg</b><button class="sm ghost danger" data-act="delbw" data-d="${b.date}">✕</button></div>`).join("")}</div>`;
}
function viewSettings() {
  return `<h1>Settings</h1>
  <div class="card"><h2>Rest timer</h2><select id="restSel">${[60, 90, 120, 150, 180].map(s => `<option value="${s}" ${S.restSec === s ? "selected" : ""}>${s} seconds</option>`).join("")}</select></div>
  <div class="card"><h2>Backup</h2><p class="mute">Data lives only on this device. Export regularly.</p>
    <div class="row"><button data-act="export">Export JSON</button><button data-act="import">Import JSON</button></div>
    <input id="file" type="file" accept="application/json" style="display:none"></div>
  <div class="card" id="installCard" style="display:${window.__bip ? "block" : "none"}"><h2>Install</h2><button class="pri" data-act="install">Install app</button></div>
  <div class="card"><h2>Danger zone</h2><button class="danger" data-act="wipe">Erase all data</button></div>
  <p class="mute">iPhone: Share → Add to Home Screen.</p>`;
}
function render() {
  const app = document.getElementById("app");
  app.innerHTML = tab === "today" ? viewToday() : tab === "history" ? viewHistory() : tab === "progress" ? viewProgress() : viewSettings();
  document.getElementById("nav").innerHTML = [["today", "🏋️", "Today"], ["history", "📜", "History"], ["progress", "📈", "Progress"], ["settings", "⚙️", "Settings"]]
    .map(([k, i, l]) => `<button class="${tab === k ? "on" : ""}" data-act="tab" data-t="${k}"><span>${i}</span>${l}</button>`).join("");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, D = S.draft, ei = +b.dataset.e, si = +b.dataset.s;
  if (a === "tab") { tab = b.dataset.t; render(); window.scrollTo(0, 0); return; }
  if (a === "start") { startSession(b.dataset.t); return; }
  if (a === "tog") { const s = D.exercises[ei].sets[si]; s.done = !s.done; save(); render(); if (s.done && D.exercises[ei].kind !== "time") startRest(); return; }
  if (a === "addset") { const ex = D.exercises[ei], l = ex.sets[ex.sets.length - 1]; ex.sets.push({ w: l.w, r: l.r, done: false }); save(); render(); return; }
  if (a === "rmset") { D.exercises[ei].sets.pop(); save(); render(); return; }
  if (a === "rmex") { if (confirm("Remove " + D.exercises[ei].name + " from this session?")) { D.exercises.splice(ei, 1); save(); render(); } return; }
  if (a === "addex") {
    const n = document.getElementById("newName").value.trim(); if (!n) return;
    const k = document.getElementById("newKind").value, l = lastFor(n);
    D.exercises.push({ name: n, kind: k, cue: "", sets: Array.from({ length: 3 }, () => ({ w: l ? l.w : 0, r: l ? l.r : (k === "time" ? 10 : 10), done: false })) });
    save(); render(); return;
  }
  if (a === "finish") {
    if (!D.exercises.some(x => x.sets.some(s => s.done))) { alert("Tick off at least one set first."); return; }
    D.exercises.forEach(x => x.sets = x.sets.filter(s => s.done));
    D.exercises = D.exercises.filter(x => x.sets.length);
    S.sessions.push(D); S.sessions.sort((x, y) => x.date.localeCompare(y.date)); S.draft = null; rest = null; save(); tickRest(); tab = "history"; render(); return;
  }
  if (a === "discard") { if (confirm("Discard this session?")) { S.draft = null; rest = null; save(); tickRest(); render(); } return; }
  if (a === "delsess") { if (confirm("Delete this session?")) { S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save(); render(); } return; }
  if (a === "metric") { progMetric = b.dataset.m; render(); return; }
  if (a === "addbw") {
    const kg = num(document.getElementById("bwKg").value), d = document.getElementById("bwDate").value || todayStr();
    if (kg < 20 || kg > 300) { alert("Enter a valid weight in kg."); return; }
    S.bw = S.bw.filter(x => x.date !== d); S.bw.push({ date: d, kg }); save(); render(); return;
  }
  if (a === "delbw") { S.bw = S.bw.filter(x => x.date !== b.dataset.d); save(); render(); return; }
  if (a === "export") {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }), u = URL.createObjectURL(blob), l = document.createElement("a");
    l.href = u; l.download = "liftlog-" + todayStr() + ".json"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); return;
  }
  if (a === "import") { document.getElementById("file").click(); return; }
  if (a === "wipe") { if (confirm("Erase ALL data? This can't be undone.") && confirm("Really erase everything?")) { S = { sessions: [], bw: [], draft: null, restSec: 90 }; save(); render(); } return; }
  if (a === "install" && window.__bip) { window.__bip.prompt(); window.__bip = null; render(); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f && S.draft) { S.draft.exercises[+t.dataset.e].sets[+t.dataset.s][t.dataset.f] = t.value === "" ? "" : num(t.value); save(); }
  else if (t.id === "note" && S.draft) { S.draft.note = t.value; save(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "progEx") { progEx = t.value; render(); }
  else if (t.id === "restSel") { S.restSec = +t.value; save(); }
  else if (t.id === "file" && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const j = JSON.parse(fr.result);
        if (!Array.isArray(j.sessions) || !Array.isArray(j.bw)) throw 0;
        if (!confirm("Replace current data with the imported file?")) return;
        S = { sessions: j.sessions, bw: j.bw, draft: j.draft || null, restSec: j.restSec || 90 }; save(); render();
      } catch (x) { alert("That file isn't a valid Lift Log backup."); }
    };
    fr.readAsText(t.files[0]);
  }
});
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__bip = e; if (tab === "settings") render(); });

render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
